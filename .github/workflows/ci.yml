name: CI

on:
  push:
    branches: [main]
  pull_request:

# Mínimo privilegio: el token del workflow solo lee el repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install -g npm@12.2.3
      # npm ci respeta el lockfile; los scripts de instalación siguen bloqueados (allowScripts).
      - run: npm ci
      - run: npm audit --audit-level=high --omit=dev
      - run: npm run db:generate
      # biome ci + typecheck (TS 7) + pruebas, incluida la suite RLS contra Postgres (PGlite, sin Docker)
      - run: npm run check

  migraciones-postgres:
    # La suite RLS corre en PGlite; aquí se aplican las migraciones a un Postgres real del mismo major que producción.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: administradorcotos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DIRECT_DATABASE_URL: postgresql://postgres:ci@localhost:5432/administradorcotos
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install -g npm@12.2.3
      - run: npm ci
      - run: npm run db:migrate:deploy

  e2e:
    # Pruebas HTTP de extremo a extremo contra Postgres 17 real (rol app_service, JWT ES256 local).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: administradorcotos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DIRECT_DATABASE_URL: postgresql://postgres:ci@localhost:5432/administradorcotos
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install -g npm@12.2.3
      - run: npm ci
      - run: npm run db:generate
      - run: npm run test:e2e

  auditoria:
    # Flujo Gemini → Claude (AGENTS.md §8): el código del PR es exactamente el que Claude aprobó.
    # Los agentes no usan git: el dictamen firma la huella del contenido (scripts/huella.ts), no un commit.
    # Rama feat/<id> → auditorias/<id>/. Dependabot (minor/patch) queda fuera; un job omitido cuenta como éxito.
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Dictamen APROBADO sobre el código actual
        env:
          RAMA: ${{ github.head_ref }} # por env, nunca interpolado en el script
        run: |
          dir="auditorias/${RAMA#*/}"
          falla() { echo "::error::$1"; exit 1; }
          [ -f "$dir/dictamen.md" ] || falla "Falta $dir/dictamen.md: ejecuta /auditar en Claude Code."
          grep -qE '^Veredicto: APROBADO\s*$' "$dir/dictamen.md" || falla "$dir/dictamen.md no está APROBADO."
          esperada=$(sed -nE 's/^Huella: ([0-9a-f]{64})\s*$/\1/p' "$dir/dictamen.md")
          [ -n "$esperada" ] || falla "$dir/dictamen.md no trae Huella."
          [ -f "$dir/manifiesto.json" ] || falla "Falta $dir/manifiesto.json."
          salida=$(node scripts/huella.ts --comparar "$dir/manifiesto.json")
          [ "$(head -n 1 <<< "$salida")" = "Huella: $esperada" ] ||
            falla "El código no es el auditado; ejecuta /auditar de nuevo. Diferencias: $(tail -n +2 <<< "$salida" | tr '\n' ' ')"
