# Desarrollo local. Sin valores por defecto para secretos: si falta uno, compose no arranca.
# Puertos solo en 127.0.0.1: nada de esto debe quedar expuesto a la red.
services:
  # ═════════════════════════════════════════════════════════════════
  # EVOLUTION API V2: GATEWAY WHATSAPP SELF-HOSTED (ANTI-BAN)
  # ═════════════════════════════════════════════════════════════════
  evolution-api:
    image: atendai/evolution-api:v2.1.2
    container_name: admcotos_evolution_api
    restart: always
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - SERVER_URL=${EVOLUTION_SERVER_URL:-http://localhost:8080}
      - DOCKER_ENV=true
      - LOG_LEVEL=ERROR,WARN,INFO
      - AUTHENTICATION_API_KEY=${EVOLUTION_MASTER_API_KEY:?Define EVOLUTION_MASTER_API_KEY}

      # Base de Datos PostgreSQL para sesiones Baileys
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:?Define DB_PASSWORD}@postgres:5432/evolution_db?schema=public
      - DATABASE_CLIENT_NAME=evolution_api

      # Redis para Colas BullMQ y Estado de Conexión
      - REDIS_ENABLED=true
      - REDIS_URI=redis://:${REDIS_PASSWORD:?Define REDIS_PASSWORD}@redis:6379/1

      # Webhooks Centrales hacia nuestro Backend
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_GLOBAL_URL=${BACKEND_WEBHOOK_URL:-http://host.docker.internal:3000/api/v1/webhooks/whatsapp-evolution}
      - WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS=true
      - WEBHOOK_EVENTS_MESSAGES_UPSERT=true
      - WEBHOOK_EVENTS_CONNECTION_UPDATE=true
      - WEBHOOK_EVENTS_SEND_MESSAGE=true

      # Identidad del Cliente
      - CONFIG_SESSION_PHONE_CLIENT=Administrador de Cotos
      - WEBSOCKET_ENABLED=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - admcotos_network

  # ═════════════════════════════════════════════════════════════════
  # POSTGRESQL (evolution_db + administradorcotos)
  # ═════════════════════════════════════════════════════════════════
  postgres:
    image: postgres:16-alpine
    container_name: admcotos_postgres
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?Define DB_PASSWORD}
      - POSTGRES_DB=evolution_db
    configs:
      - source: crear_bd_app
        target: /docker-entrypoint-initdb.d/01-app.sql
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - admcotos_network

  # ═════════════════════════════════════════════════════════════════
  # REDIS (COLAS BULLMQ, RATE LIMITS Y ESTADOS DE SESIÓN)
  # ═════════════════════════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    container_name: admcotos_redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Define REDIS_PASSWORD}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping']
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    networks:
      - admcotos_network

configs:
  crear_bd_app:
    content: "CREATE DATABASE administradorcotos;"

volumes:
  postgres_data:
  redis_data:

networks:
  admcotos_network:
    driver: bridge
