version: '3.8'

services:
  # ═════════════════════════════════════════════════════════════════
  # EVOLUTION API V2: GATEWAY WHATSAPP SELF-HOSTED (ANTI-BAN)
  # ═════════════════════════════════════════════════════════════════
  evolution-api:
    image: atendai/evolution-api:v2.1.2
    container_name: admcotos_evolution_api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=${EVOLUTION_SERVER_URL:-http://localhost:8080}
      - DOCKER_ENV=true
      - LOG_LEVEL=ERROR,WARN,INFO
      - AUTHENTICATION_API_KEY=${EVOLUTION_MASTER_API_KEY:-dev_master_key_admcotos_2026}
      
      # Base de Datos PostgreSQL para sesiones Baileys
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-admin_password}@postgres:5432/evolution_db?schema=public
      - DATABASE_CLIENT_NAME=evolution_api
      
      # Redis para Colas BullMQ y Estado de Conexión
      - REDIS_ENABLED=true
      - REDIS_URI=redis://:${REDIS_PASSWORD:-}@redis:6379/1
      
      # Webhooks Centrales hacia nuestro Backend
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_GLOBAL_URL=${BACKEND_WEBHOOK_URL:-http://host.docker.internal:3000/api/v1/webhooks/whatsapp-evolution}
      - WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS=true
      - WEBHOOK_EVENTS_MESSAGES_UPSERT=true
      - WEBHOOK_EVENTS_CONNECTION_UPDATE=true
      - WEBHOOK_EVENTS_SEND_MESSAGE=true
      
      # Identidad del Cliente
      - CONFIG_SESSION_PHONE_CLIENT=Administrador de Cotos
      - WEBSOCKET_ENABLED=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - admcotos_network

  # ═════════════════════════════════════════════════════════════════
  # POSTGRESQL DEDICADO / COMPARTIDO
  # ═════════════════════════════════════════════════════════════════
  postgres:
    image: postgres:16-alpine
    container_name: admcotos_postgres
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-admin_password}
      - POSTGRES_MULTIPLE_DATABASES=administradorcotos,evolution_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - admcotos_network

  # ═════════════════════════════════════════════════════════════════
  # REDIS (COLAS BULLMQ, RATE LIMITS Y ESTADOS DE SESIÓN)
  # ═════════════════════════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    container_name: admcotos_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - admcotos_network

volumes:
  postgres_data:
  redis_data:

networks:
  admcotos_network:
    driver: bridge
